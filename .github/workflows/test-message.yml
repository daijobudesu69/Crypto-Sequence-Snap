name: Kirim pesan tes

# Manual saja. Mengirim satu sinyal CONTOH bertanda TES ke Telegram, untuk
# memastikan TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID sudah benar.
on:
  workflow_dispatch:

jobs:
  test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kirim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/send_test.py
